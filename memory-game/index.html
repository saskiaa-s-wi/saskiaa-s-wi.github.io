<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Animal Match</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #e2dacd;
      --card-back: #8d7b68;
      --red-player: #e65c5c;
      --blue-player: #4a90e2;
      --text-color: #4a403a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .header {
      display: flex;
      gap: 40px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .player-score {
      padding: 8px 16px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }

    .player-score.red { color: var(--red-player); }
    .player-score.blue { color: var(--blue-player); }

    .player-score.active-red {
      background-color: var(--red-player);
      color: white;
    }

    .player-score.active-blue {
      background-color: var(--blue-player);
      color: white;
    }

    #game-board {
      display: grid;
      gap: 15px;
      padding: 20px;
      background-color: #efebe4;
      border-radius: 16px;
      border: 6px solid var(--red-player);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transition: border-color 0.3s ease;
    }

    #game-board.turn-RED { border-color: var(--red-player); }
    #game-board.turn-BLUE { border-color: var(--blue-player); }

    .card {
      width: 110px;
      height: 110px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
      border-radius: 12px;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .card-back {
      background-color: var(--card-back);
      color: #fff;
      font-size: 2rem;
    }

    .card-front {
      background-color: var(--card-bg);
      transform: rotateY(180deg);
      font-size: 3.2rem;
    }

    /* Fixed grid dimension preservation when matched */
    .card.matched {
      visibility: hidden;
      pointer-events: none;
    }

    /* Overlay / Victory Modal */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 30px 50px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .modal h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: var(--text-color);
    }

    .restart-btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: var(--card-back);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background-color: #6d5f50;
    }
  </style>
</head>
<body>

  <div class="header">
    <div id="score-red" class="player-score red active-red">Player Red: 0</div>
    <div id="score-blue" class="player-score blue">Player Blue: 0</div>
  </div>

  <div id="game-board" class="turn-RED"></div>

  <div id="victory-modal" class="overlay">
    <div class="modal">
      <h2 id="victory-message">Player Red won.</h2>
      <button class="restart-btn" onclick="game.startLevel(1)">Restart Game</button>
    </div>
  </div>

  <script>
    // Scalable Level Configuration
    const LEVEL_CONFIGS = {
      1: {
        pairsCount: 10,
        gridCols: 5,
        gridRows: 4,
        items: ['🐱', '🐶', '🐰', '🐻', '🐼', '🦊', '🐨', '🦁', '🐯', '🐸']
      }
      // Level 2, 3, etc. can be configured here in the future
    };

    class CozyAnimalMatch {
      constructor() {
        this.boardEl = document.getElementById('game-board');
        this.scoreRedEl = document.getElementById('score-red');
        this.scoreBlueEl = document.getElementById('score-blue');
        this.modalEl = document.getElementById('victory-modal');
        this.victoryMsgEl = document.getElementById('victory-message');

        this.currentLevel = 1;
        this.activePlayer = 'RED';
        this.scores = { RED: 0, BLUE: 0 };
        this.flippedCards = [];
        this.matchedPairs = 0;
        this.isBoardLocked = false;
      }

      startLevel(levelNumber) {
        const config = LEVEL_CONFIGS[levelNumber] || LEVEL_CONFIGS[1];
        this.currentLevel = levelNumber;
        this.activePlayer = 'RED';
        this.scores = { RED: 0, BLUE: 0 };
        this.flippedCards = [];
        this.matchedPairs = 0;
        this.isBoardLocked = false;

        this.modalEl.classList.remove('show');
        this.updateUI();

        // Prepare and shuffle cards
        const cardValues = [...config.items, ...config.items];
        this.shuffleArray(cardValues);

        // Build Board Grid
        this.boardEl.style.gridTemplateColumns = `repeat(${config.gridCols}, 110px)`;
        this.boardEl.style.gridTemplateRows = `repeat(${config.gridRows}, 110px)`;
        this.boardEl.innerHTML = '';

        cardValues.forEach((value, index) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.dataset.index = index;
          cardEl.dataset.value = value;

          cardEl.innerHTML = `
            <div class="card-inner">
              <div class="card-back">🐾</div>
              <div class="card-front">${value}</div>
            </div>
          `;

          cardEl.addEventListener('click', () => this.handleCardClick(cardEl));
          this.boardEl.appendChild(cardEl);
        });
      }

      handleCardClick(cardEl) {
        if (this.isBoardLocked) return;
        if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

        cardEl.classList.add('flipped');
        this.flippedCards.push(cardEl);

        if (this.flippedCards.length === 2) {
          this.checkMatch();
        }
      }

      checkMatch() {
        const [card1, card2] = this.flippedCards;
        const val1 = card1.dataset.value;
        const val2 = card2.dataset.value;

        if (val1 === val2) {
          // Match logic
          this.scores[this.activePlayer] += 1;
          this.matchedPairs += 1;

          setTimeout(() => {
            card1.classList.add('matched');
            card2.classList.add('matched');
            this.flippedCards = [];
            this.updateUI();

            const config = LEVEL_CONFIGS[this.currentLevel];
            if (this.matchedPairs === config.pairsCount) {
              this.endGame();
            }
          }, 300);
        } else {
          // Mismatch logic: 1 second lock
          this.isBoardLocked = true;
          setTimeout(() => {
            card1.classList.remove('flipped');
            card2.classList.remove('flipped');
            this.flippedCards = [];
            this.activePlayer = this.activePlayer === 'RED' ? 'BLUE' : 'RED';
            this.isBoardLocked = false;
            this.updateUI();
          }, 1000);
        }
      }

      updateUI() {
        this.scoreRedEl.textContent = `Player Red: ${this.scores.RED}`;
        this.scoreBlueEl.textContent = `Player Blue: ${this.scores.BLUE}`;

        this.scoreRedEl.className = `player-score red ${this.activePlayer === 'RED' ? 'active-red' : ''}`;
        this.scoreBlueEl.className = `player-score blue ${this.activePlayer === 'BLUE' ? 'active-blue' : ''}`;

        this.boardEl.className = `turn-${this.activePlayer}`;
      }

      endGame() {
        if (this.scores.RED > this.scores.BLUE) {
          this.victoryMsgEl.textContent = 'Player Red won.';
        } else if (this.scores.BLUE > this.scores.RED) {
          this.victoryMsgEl.textContent = 'Player Blue won.';
        } else {
          this.victoryMsgEl.textContent = "It's a draw!";
        }
        this.modalEl.classList.add('show');
      }

      shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }
    }

    const game = new CozyAnimalMatch();
    game.startLevel(1);
  </script>
</body>
</html>
